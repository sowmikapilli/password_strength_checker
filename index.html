<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SecurePass | Password Tools</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>🔐 SecurePass</h1>
    <p class="subtitle">Generate and check your passwords</p>

    <section class="card">
      <h2>Password Generator</h2>

      <label for="length">Password length: <span id="lengthValue">16</span></label>
      <input type="range" id="length" min="8" max="32" value="16">

      <div class="options">
        <label><input type="checkbox" id="uppercase" checked> Uppercase (A-Z)</label>
        <label><input type="checkbox" id="lowercase" checked> Lowercase (a-z)</label>
        <label><input type="checkbox" id="numbers" checked> Numbers (0-9)</label>
        <label><input type="checkbox" id="symbols" checked> Symbols (!@#)</label>
      </div>

      <button id="generate">Generate Password</button>

      <label for="generatedPassword">Generated password</label>
      <div class="password-row">
        <input type="password" id="generatedPassword" readonly placeholder="Your password will appear here">
        <button id="showGenerated" type="button">Show</button>
        <button id="copy" type="button">Copy</button>
      </div>
      <p id="generatorMessage" aria-live="polite"></p>
    </section>

    <section class="card">
      <h2>Password Strength Checker</h2>

      <label for="checkPassword">Enter a sample password</label>
      <input type="password" id="checkPassword" placeholder="Type a sample password">

      <button id="toggleCheck" type="button">Show</button>

      <p>Strength: <strong id="strength">Not checked</strong></p>
      <div class="strength-track">
        <div id="strengthBar"></div>
      </div>

      <ul id="requirements">
        <li id="reqLength">At least 8 characters</li>
        <li id="reqUpper">An uppercase letter</li>
        <li id="reqLower">A lowercase letter</li>
        <li id="reqNumber">A number</li>
        <li id="reqSymbol">A special character</li>
      </ul>
    </section>

    <p class="notice">For learning and demonstration only. Do not enter real passwords.</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
